name: Build Portable-Linux installer image
on:
  push:
    branches: ["main"]
    paths: ["config/**","scripts/**","docs/**",".github/workflows/build-installer.yml"]
  pull_request:
    paths: ["config/**","scripts/**","docs/**",".github/workflows/build-installer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed xorriso mtools dosfstools qemu-system-x86 ovmf
      - name: Build Debian root filesystem
        run: sudo bash scripts/build/build-rootfs.sh
      - name: Add installer entrypoint
        run: sudo bash scripts/build/prepare-installer-rootfs.sh
      - name: Validate built root filesystem
        run: |
          test -s build/rootfs/etc/portable-linux-release
          test -n "$(find build/rootfs/boot -maxdepth 1 -name 'vmlinuz-*' -print -quit)"
          test -n "$(find build/rootfs/boot -maxdepth 1 -name 'initrd.img-*' -print -quit)"
          test -x build/rootfs/usr/sbin/grub-install
          test -x build/rootfs/usr/local/bin/portable-install
          test -f build/rootfs/etc/systemd/system/portable-swap.service
      - name: Build bootable ISO
        run: sudo bash scripts/build/build-iso.sh
      - name: Validate ISO
        run: |
          file dist/protable-linux-installer-amd64.iso
          test -s dist/protable-linux-installer-amd64.iso
          sha256sum -c dist/protable-linux-installer-amd64.iso.sha256
      - name: Boot ISO under QEMU UEFI
        run: |
          set +e
          timeout 180s qemu-system-x86_64             -machine q35,accel=tcg             -m 2048             -smp 2             -bios /usr/share/OVMF/OVMF_CODE_4M.fd             -cdrom dist/protable-linux-installer-amd64.iso             -boot d             -display none             -serial file:qemu-serial.log             -monitor none             -no-reboot
          rc=$?
          set -e
          grep -Eqi 'Reached target (multi-user|graphical)|Started (Light Display Manager|Network Manager)' qemu-serial.log
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $rc" >&2
            exit "$rc"
          fi
      - name: Test installer on isolated loopback disk
        run: sudo bash scripts/tests/test-installer-loopback.sh
      - name: Generate build manifest
        run: |
          mkdir -p dist
          sha256sum dist/protable-linux-installer-amd64.iso > dist/protable-linux-installer-amd64.iso.sha256
          {
            echo "product=Protable-Linux"
            echo "debian_codename=$(grep '^DEBIAN_CODENAME=' config/debian-release.env | cut -d= -f2)"
            echo "debian_version=$(grep '^DEBIAN_VERSION=' config/debian-release.env | cut -d= -f2)"
            echo "debian_point_release=$(grep '^DEBIAN_POINT_RELEASE=' config/debian-release.env | cut -d= -f2)"
            echo "git_sha=$GITHUB_SHA"
            echo "iso_sha256=$(cut -d' ' -f1 dist/protable-linux-installer-amd64.iso.sha256)"
            echo "runner=$RUNNER_OS"
          } > dist/protable-linux-installer-amd64.manifest.txt
      - name: Upload installer ISO and manifest
        uses: actions/upload-artifact@v4
        with:
          name: protable-linux-installer-amd64
          path: |
            dist/protable-linux-installer-amd64.iso
            dist/protable-linux-installer-amd64.iso.sha256
            dist/protable-linux-installer-amd64.manifest.txt
          if-no-files-found: error
