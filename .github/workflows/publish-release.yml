name: Publish first Protable-Linux release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-release.yml"
      - "config/**"
      - "scripts/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Update existing release description
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
# Protable-Linux v0.1.0

**Your Linux system. Your USB. Your workspace — portable.**

Protable-Linux v0.1.0 is the first public installer milestone of a persistent, USB-native Linux system. It installs a complete Debian-based desktop environment onto a USB drive so applications, settings, files, and projects can travel with the drive.

## ✨ Highlights
- Debian 13 (trixie) amd64 base
- Lightweight XFCE desktop with LightDM
- Persistent USB installation — not just a live session
- UEFI removable boot support
- Automatic root partition sizing
- One ext4 root filesystem with no separate /home partition
- ZRAM support with a persistent swapfile fallback
- Safety checks designed to prevent accidental internal-disk installation
- Hardware discovery at boot for use across compatible PCs
- Verified bootable ISO, checksum, and release manifest

## 💾 Recommended hardware
A 64 GB USB drive is a practical reference target for this release. The installer uses approximately 512 MiB for the EFI System Partition and assigns the remaining capacity to the root filesystem.

## 🚀 Quick start
1. Download the ISO below.
2. Verify its SHA-256 checksum.
3. Write the ISO to temporary installer media with a trusted ISO-writing tool.
4. Boot that media in UEFI mode.
5. Select the intended USB target carefully.
6. Run the Portable-Linux installer.
7. Boot from the newly installed USB and verify persistence.

> ⚠️ **WARNING:** Installing Portable-Linux erases the selected target USB drive. Never select an internal SSD/HDD.

## 📚 Installation guide
For a beginner-friendly, step-by-step installation procedure, read:

**docs/HELP-v0.1.0-INSTALL.txt**

## 📦 Release assets
- ISO: protable-linux-installer-amd64.iso
- Checksum: protable-linux-installer-amd64.iso.sha256
- Manifest: protable-linux-installer-amd64.manifest.txt

## 🔐 Verification
ISO SHA-256:

ad729eb14d74ec422b6439d539f7915a48866a2eeb0b78fcec046a2db8cf75ec

## ⚠️ v0.1.0 scope
This is the first installer milestone. UEFI is the primary supported boot path. BIOS/Legacy compatibility, full-root encryption, recovery tooling, and broader hardware validation are planned for subsequent releases.

Before using the system as your primary portable environment, test it on the target hardware and confirm boot, persistence, networking, storage, display, audio, and shutdown/reboot behavior.

**Have fun building a Linux system that actually travels with you.**
EOF
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Protable-Linux $RELEASE_TAG" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Stop after updating existing release
        if: steps.existing.outputs.exists == 'true'
        run: echo "Existing release description updated."


      - name: Install image build dependencies
        if: steps.existing.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed xorriso mtools dosfstools qemu-system-x86 ovmf

      - name: Build Debian root filesystem
        if: steps.existing.outputs.exists != 'true'
        run: sudo bash scripts/build/build-rootfs.sh

      - name: Add installer entrypoint
        if: steps.existing.outputs.exists != 'true'
        run: sudo bash scripts/build/prepare-installer-rootfs.sh

      - name: Validate built root filesystem
        if: steps.existing.outputs.exists != 'true'
        run: |
          test -s build/rootfs/etc/portable-linux-release
          test -n "$(find build/rootfs/boot -maxdepth 1 -name 'vmlinuz-*' -print -quit)"
          test -n "$(find build/rootfs/boot -maxdepth 1 -name 'initrd.img-*' -print -quit)"
          test -x build/rootfs/usr/sbin/grub-install
          test -x build/rootfs/usr/local/bin/portable-install
          test -f build/rootfs/etc/systemd/system/portable-swap.service

      - name: Build bootable ISO
        if: steps.existing.outputs.exists != 'true'
        run: sudo bash scripts/build/build-iso.sh

      - name: Normalize artifact ownership
        if: steps.existing.outputs.exists != 'true'
        run: sudo chown -R "$USER:$USER" dist

      - name: Validate ISO and checksum
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          test -s dist/protable-linux-installer-amd64.iso
          sha256sum -c dist/protable-linux-installer-amd64.iso.sha256

      - name: Generate release manifest
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sha256sum dist/protable-linux-installer-amd64.iso > dist/protable-linux-installer-amd64.iso.sha256
          {
            echo "product=Protable-Linux"
            echo "release=$RELEASE_TAG"
            echo "debian_codename=$(grep '^DEBIAN_CODENAME=' config/debian-release.env | cut -d= -f2)"
            echo "debian_version=$(grep '^DEBIAN_VERSION=' config/debian-release.env | cut -d= -f2)"
            echo "debian_point_release=$(grep '^DEBIAN_POINT_RELEASE=' config/debian-release.env | cut -d= -f2)"
            echo "git_sha=$GITHUB_SHA"
            echo "iso_sha256=$(cut -d' ' -f1 dist/protable-linux-installer-amd64.iso.sha256)"
          } > dist/protable-linux-installer-amd64.manifest.txt

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Protable-Linux $RELEASE_TAG"             --generate-notes             dist/protable-linux-installer-amd64.iso             dist/protable-linux-installer-amd64.iso.sha256             dist/protable-linux-installer-amd64.manifest.txt

      - name: Verify published release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'protable-linux-installer-amd64.iso.sha256' --dir verify
          test -s verify/protable-linux-installer-amd64.iso.sha256
